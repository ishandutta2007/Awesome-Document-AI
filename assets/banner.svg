<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.8" />
    </linearGradient>

    <linearGradient id="laserGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(56, 189, 248, 0)" />
      <stop offset="20%" stop-color="rgba(56, 189, 248, 0.7)" />
      <stop offset="50%" stop-color="rgba(192, 132, 252, 1)" />
      <stop offset="80%" stop-color="rgba(56, 189, 248, 0.7)" />
      <stop offset="100%" stop-color="rgba(56, 189, 248, 0)" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95" />
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes scanMotion {
      0% { transform: translateY(0px); opacity: 0.3; }
      50% { transform: translateY(140px); opacity: 0.95; }
      100% { transform: translateY(0px); opacity: 0.3; }
    }
    @keyframes pulseOrb {
      0% { transform: scale(1); opacity: 0.25; }
      50% { transform: scale(1.18); opacity: 0.55; }
      100% { transform: scale(1); opacity: 0.25; }
    }
    @keyframes floatCard {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-7px); }
      100% { transform: translateY(0px); }
    }
    @keyframes dashMove {
      to { stroke-dashoffset: -28; }
    }
    @keyframes badgePulse {
      0% { opacity: 0.7; }
      50% { opacity: 1; }
      100% { opacity: 0.7; }
    }
    .scanner-line {
      animation: scanMotion 3.8s ease-in-out infinite;
    }
    .pulse-orb-1 {
      animation: pulseOrb 6.5s ease-in-out infinite;
      transform-origin: 220px 120px;
    }
    .pulse-orb-2 {
      animation: pulseOrb 7.5s ease-in-out infinite 1.5s;
      transform-origin: 1020px 300px;
    }
    .card-float-1 {
      animation: floatCard 4.8s ease-in-out infinite;
    }
    .card-float-2 {
      animation: floatCard 5.4s ease-in-out infinite 0.6s;
    }
    .card-float-3 {
      animation: floatCard 4.2s ease-in-out infinite 1.2s;
    }
    .flow-dash {
      stroke-dasharray: 6 4;
      animation: dashMove 2.5s linear infinite;
    }
    .badge-glow {
      animation: badgePulse 3s ease-in-out infinite;
    }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="2" />

  <!-- Background Glowing Orbs -->
  <circle class="pulse-orb-1" cx="220" cy="120" r="150" fill="#6366f1" filter="url(#glow)" opacity="0.3" />
  <circle class="pulse-orb-2" cx="1020" cy="300" r="170" fill="#06b6d4" filter="url(#glow)" opacity="0.25" />
  <circle cx="620" cy="210" r="230" fill="#a855f7" filter="url(#glow)" opacity="0.12" />

  <!-- Futuristic Grid Lines -->
  <g stroke="#334155" stroke-width="0.5" opacity="0.22">
    <line x1="0" y1="70" x2="1200" y2="70" />
    <line x1="0" y1="140" x2="1200" y2="140" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="280" x2="1200" y2="280" />
    <line x1="0" y1="350" x2="1200" y2="350" />
    <line x1="150" y1="0" x2="150" y2="420" />
    <line x1="300" y1="0" x2="300" y2="420" />
    <line x1="450" y1="0" x2="450" y2="420" />
    <line x1="600" y1="0" x2="600" y2="420" />
    <line x1="750" y1="0" x2="750" y2="420" />
    <line x1="900" y1="0" x2="900" y2="420" />
    <line x1="1050" y1="0" x2="1050" y2="420" />
  </g>

  <!-- Left Header Branding -->
  <g transform="translate(60, 48)">
    <!-- Top Pill Badge -->
    <g class="badge-glow">
      <rect width="210" height="26" rx="13" fill="#1e293b" stroke="#38bdf8" stroke-width="1" opacity="0.9" />
      <circle cx="14" cy="13" r="4" fill="#38bdf8" />
      <text x="26" y="17" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="11" font-weight="600" letter-spacing="1.2">INTELLIGENT DOCUMENT AI</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="78" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="44" font-weight="800" letter-spacing="-0.5">
      Awesome <tspan fill="url(#primaryGrad)">Document AI</tspan> 📄⚡
    </text>

    <!-- Subtitle / Tagline -->
    <text x="0" y="112" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="15" font-weight="400">
      Curated ecosystem of SaaS &amp; Open-Source IDP, OCR engines, Layout Analysis &amp; VLMs
    </text>

    <!-- Tech Badges Under Title -->
    <g transform="translate(0, 134)">
      <!-- Badge 1: OCR & VLMs -->
      <rect x="0" y="0" width="108" height="26" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text x="12" y="17" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="11" font-weight="500">👁️ OCR &amp; VLMs</text>

      <!-- Badge 2: Layout Parser -->
      <rect x="116" y="0" width="120" height="26" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text x="128" y="17" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="11" font-weight="500">📐 Layout Analysis</text>

      <!-- Badge 3: Tables & Forms -->
      <rect x="244" y="0" width="122" height="26" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text x="256" y="17" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="11" font-weight="500">📊 Tables &amp; Forms</text>

      <!-- Badge 4: Multimodal RAG -->
      <rect x="374" y="0" width="134" height="26" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text x="386" y="17" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="11" font-weight="500">🤖 Structured Output</text>
    </g>
  </g>

  <!-- Right Visual Flow: Interactive Architecture Cards -->
  <g transform="translate(630, 40)">
    <!-- Connector Lines with Animated Dashes -->
    <path d="M 130 155 L 180 155" stroke="#475569" stroke-width="2" />
    <path d="M 130 155 L 180 155" stroke="#38bdf8" stroke-width="2" class="flow-dash" />

    <path d="M 330 155 L 375 155" stroke="#475569" stroke-width="2" />
    <path d="M 330 155 L 375 155" stroke="#818cf8" stroke-width="2" class="flow-dash" />

    <!-- Card 1: Input Document -->
    <g class="card-float-1" transform="translate(0, 70)">
      <rect width="130" height="170" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
      <!-- Header bar -->
      <path d="M 0 10 C 0 4.5 4.5 0 10 0 L 120 0 C 125.5 0 130 4.5 130 10 L 130 32 L 0 32 Z" fill="#0f172a" />
      <circle cx="14" cy="16" r="3.5" fill="#ef4444" />
      <circle cx="25" cy="16" r="3.5" fill="#f59e0b" />
      <circle cx="36" cy="16" r="3.5" fill="#10b981" />
      <text x="50" y="20" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="10" font-weight="600">INPUT DOC</text>

      <!-- Document lines representing text/tables -->
      <rect x="14" y="44" width="75" height="7" rx="3" fill="#38bdf8" opacity="0.8" />
      <rect x="14" y="58" width="102" height="5" rx="2.5" fill="#64748b" opacity="0.6" />
      <rect x="14" y="69" width="88" height="5" rx="2.5" fill="#64748b" opacity="0.5" />
      <rect x="14" y="80" width="96" height="5" rx="2.5" fill="#64748b" opacity="0.5" />

      <!-- Mini Table representation -->
      <rect x="14" y="94" width="102" height="38" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <line x1="14" y1="106" x2="116" y2="106" stroke="#334155" stroke-width="1" />
      <line x1="50" y1="94" x2="50" y2="132" stroke="#334155" stroke-width="1" />
      <line x1="84" y1="94" x2="84" y2="132" stroke="#334155" stroke-width="1" />

      <!-- Tags -->
      <text x="14" y="152" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="9" font-weight="600">PDF • DOCX • SCAN</text>

      <!-- Dynamic Scanning Beam on Card 1 -->
      <g class="scanner-line">
        <rect x="2" y="36" width="126" height="3" fill="url(#laserGrad)" filter="url(#softGlow)" />
        <rect x="6" y="37" width="118" height="1.5" fill="#38bdf8" />
      </g>
    </g>

    <!-- Card 2: AI Parsing Engine (Middle Hub) -->
    <g class="card-float-2" transform="translate(180, 50)">
      <rect width="150" height="210" rx="12" fill="url(#cardGrad)" stroke="#818cf8" stroke-width="1.8" filter="url(#softGlow)" />
      <!-- Top banner -->
      <path d="M 0 12 C 0 5.4 5.4 0 12 0 L 138 0 C 144.6 0 150 5.4 150 12 L 150 36 L 0 36 Z" fill="#1e1b4b" />
      <text x="75" y="23" text-anchor="middle" fill="#a5b4fc" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="11" font-weight="700">DOCUMENT AI ENGINE</text>

      <!-- Inner modules -->
      <rect x="12" y="48" width="126" height="30" rx="6" fill="#0f172a" stroke="#4338ca" stroke-width="1" />
      <text x="22" y="67" fill="#c7d2fe" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="10" font-weight="600">🧠 VLM / Layout Analysis</text>

      <rect x="12" y="86" width="126" height="30" rx="6" fill="#0f172a" stroke="#4338ca" stroke-width="1" />
      <text x="22" y="105" fill="#c7d2fe" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="10" font-weight="600">⚡ OCR &amp; Handwriting</text>

      <rect x="12" y="124" width="126" height="30" rx="6" fill="#0f172a" stroke="#4338ca" stroke-width="1" />
      <text x="22" y="143" fill="#c7d2fe" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="10" font-weight="600">📊 Table &amp; Form Parser</text>

      <rect x="12" y="162" width="126" height="30" rx="6" fill="#0f172a" stroke="#4338ca" stroke-width="1" />
      <text x="22" y="181" fill="#c7d2fe" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="10" font-weight="600">🔗 Entity Extraction</text>
    </g>

    <!-- Card 3: Structured Output -->
    <g class="card-float-3" transform="translate(375, 70)">
      <rect width="130" height="170" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
      <!-- Header bar -->
      <path d="M 0 10 C 0 4.5 4.5 0 10 0 L 120 0 C 125.5 0 130 4.5 130 10 L 130 32 L 0 32 Z" fill="#0f172a" />
      <circle cx="14" cy="16" r="3.5" fill="#10b981" />
      <text x="26" y="20" fill="#10b981" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="10" font-weight="700">STRUCTURED</text>

      <!-- Code representation -->
      <rect x="12" y="44" width="60" height="6" rx="2" fill="#a855f7" />
      <text x="14" y="65" fill="#f1f5f9" font-family="Courier, monospace" font-size="8.5">"tables": [ { ... } ]</text>
      <text x="14" y="80" fill="#f1f5f9" font-family="Courier, monospace" font-size="8.5">"form_fields": {</text>
      <text x="20" y="94" fill="#38bdf8" font-family="Courier, monospace" font-size="8">"total": "$1,450",</text>
      <text x="20" y="107" fill="#38bdf8" font-family="Courier, monospace" font-size="8">"due": "2026-09"</text>
      <text x="14" y="120" fill="#f1f5f9" font-family="Courier, monospace" font-size="8.5">}</text>

      <!-- Output pill -->
      <rect x="12" y="136" width="106" height="20" rx="4" fill="#10b981" opacity="0.15" />
      <text x="65" y="150" text-anchor="middle" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="9" font-weight="600">JSON • MARKDOWN</text>
    </g>
  </g>

  <!-- Bottom Metric & Tech Ticker Bar -->
  <g transform="translate(60, 362)">
    <rect width="1080" height="34" rx="8" fill="#0b1120" stroke="#1e293b" stroke-width="1" />
    <text x="24" y="22" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="11" font-weight="600" letter-spacing="1">FEATURED TECHNOLOGIES &amp; FRAMEWORKS:</text>

    <text x="290" y="22" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="11" font-weight="500">PaddleOCR</text>
    <circle cx="370" cy="18" r="2.5" fill="#475569" />
    <text x="385" y="22" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="11" font-weight="500">Docling</text>
    <circle cx="445" cy="18" r="2.5" fill="#475569" />
    <text x="460" y="22" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="11" font-weight="500">MinerU</text>
    <circle cx="520" cy="18" r="2.5" fill="#475569" />
    <text x="535" y="22" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="11" font-weight="500">Surya</text>
    <circle cx="585" cy="18" r="2.5" fill="#475569" />
    <text x="600" y="22" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="11" font-weight="500">Marker</text>
    <circle cx="660" cy="18" r="2.5" fill="#475569" />
    <text x="675" y="22" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="11" font-weight="500">Unstructured</text>
    <circle cx="770" cy="18" r="2.5" fill="#475569" />
    <text x="785" y="22" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="11" font-weight="500">olmOCR</text>
    <circle cx="850" cy="18" r="2.5" fill="#475569" />
    <text x="865" y="22" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="11" font-weight="500">LlamaParse</text>
    <circle cx="950" cy="18" r="2.5" fill="#475569" />
    <text x="965" y="22" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="11" font-weight="600">Azure &amp; Google AI</text>
  </g>
</svg>
